name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tehkarta
          POSTGRES_PASSWORD: tehkarta
          POSTGRES_DB: tehkarta_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tehkarta -d tehkarta_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://tehkarta:tehkarta@localhost:5432/tehkarta_ci
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
      - run: pnpm db:smoke
      - name: Bootstrap authenticated RP/UMK development fixture twice
        env:
          DEV_BOOTSTRAP_EMAIL: teacher@bootstrap.test
          DEV_BOOTSTRAP_PASSWORD: Bootstrap-Test-Password-2026!
        run: pnpm db:bootstrap-dev && pnpm db:bootstrap-dev

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build production API image
        run: docker build --file apps/api/Dockerfile --tag tehkarta-api:ci .
      - name: Assert API non-root runtime
        run: test "$(docker image inspect tehkarta-api:ci --format '{{.Config.User}}')" = "node"
      - name: Build production worker image
        run: docker build --file apps/worker/Dockerfile --tag tehkarta-worker:ci .
      - name: Assert worker non-root runtime
        run: test "$(docker image inspect tehkarta-worker:ci --format '{{.Config.User}}')" = "node"

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8
      - name: Terraform format
        run: terraform fmt -check -diff -recursive infra/terraform
      - name: Terraform init
        working-directory: infra/terraform/environments/dev
        run: terraform init -backend=false -input=false
      - name: Terraform validate
        working-directory: infra/terraform/environments/dev
        run: terraform validate -no-color
